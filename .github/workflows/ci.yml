name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"   # every Monday: new CVEs or a library release that breaks the code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, no API key)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]   # 3.11 = the Docker image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests with a fake Gemini client
        run: python -m pytest -q -W error::DeprecationWarning
      - name: Eval keyword grading still matches the saved replies
        run: python -m scripts.eval_questions --rescore --no-save --fail-under 1.0

  docker:
    name: Docker image builds and runs as non-root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hotel-bot .
      - name: Container user is not root
        run: test "$(docker run --rm hotel-bot id -u)" = "10001"

  security:
    name: Secrets and known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan the whole git history, not only the last commit
      - name: No API keys or passwords in the repo (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
