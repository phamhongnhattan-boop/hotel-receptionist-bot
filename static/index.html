<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Son Tra Demo Hotel - Lễ tân AI</title>
<style>
  :root { --brand:#0f6e6e; --bg:#f4f6f8; --bot:#ffffff; --me:#d9f0ef; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; margin:0; }
  header button { background:transparent; color:#fff; border:1px solid #fff8; border-radius:6px; padding:4px 10px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:760px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; margin:8px 0; max-width:85%; white-space:pre-wrap; line-height:1.45; }
  .bot { background:var(--bot); box-shadow:0 1px 2px #0001; }
  .me { background:var(--me); margin-left:auto; }
  .src { font-size:11px; color:#667; margin-top:6px; }
  form { display:flex; gap:8px; padding:12px 16px; max-width:760px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px; border:1px solid #ccd; border-radius:10px; font-size:15px; }
  form button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:0 18px; font-size:15px; cursor:pointer; }
  form button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>
  <h1>Son Tra Demo Hotel · Lễ tân AI</h1>
  <button id="reset" type="button">Cuộc trò chuyện mới</button>
</header>
<div id="log"></div>
<form id="form">
  <input id="text" autocomplete="off" placeholder="Hỏi về phòng, giá, tiện ích... / Ask in English" required>
  <button id="send">Gửi</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("text");
  const sendBtn = document.getElementById("send");
  let sessionId = crypto.randomUUID();

  function add(text, who, sources) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    if (sources && sources.length) {
      const s = document.createElement("div");
      s.className = "src";
      s.textContent = "Nguồn: " + sources.map(x => x.title).join(" · ");
      div.appendChild(s);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  add("Xin chào! Tôi là lễ tân ảo của Son Tra Demo Hotel. Tôi có thể giúp gì cho bạn?\nHello! How can I help you today?", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, "me");
    input.value = "";
    sendBtn.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Error");
      add(data.reply, "bot", data.sources);
    } catch (err) {
      add("Xin lỗi, hệ thống đang bận. Vui lòng thử lại.", "bot");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    await fetch("/api/reset/" + sessionId, { method: "POST" });
    sessionId = crypto.randomUUID();
    log.innerHTML = "";
    add("Đã bắt đầu cuộc trò chuyện mới. / New conversation started.", "bot");
  });
</script>
</body>
</html>
